# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

separator: "  # "

ignore_actions:
  # Official GitHub actions are already pinned via SHA references in workflows;
  # pinact would strip their version comments since they use non-semver refs.
  - name: actions/.*
    ref: .*
